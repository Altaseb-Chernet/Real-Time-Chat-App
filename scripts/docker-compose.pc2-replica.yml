version: '3.8'

# ============================================================
# PC2: API CLIENT
# This docker-compose connects directly to PC1's databases
# Replace PC1_IP with actual IP (e.g., 192.168.1.100)
# ============================================================

services:
  # ============================================================
  # API - Connects to PC1 for all data
  # ============================================================
  api:
    build:
      context: ..
      dockerfile: scripts/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - SKIP_MIGRATIONS=true
      # IMPORTANT: Point to PC1's PostgreSQL
      # Change PC1_IP to PC1's actual IP address
      - ConnectionStrings__DefaultConnection=Host=PC1_IP;Port=5432;Database=chatapp;Username=postgres;Password=altaseb;Include Error Detail=true
      - JwtSettings__Secret=bbd8dab53ffc6dd9ef781cc176a2aaef3ce2e15a292584f3112fac2010bfccee
      - JwtSettings__Issuer=ChatApplication
      - JwtSettings__Audience=ChatApplication
      - JwtSettings__ExpiryMinutes=60
      # Point to PC1's Redis
      - RedisSettings__ConnectionString=PC1_IP:6379
      # Point to PC1's RabbitMQ for messaging
      - RabbitMqSettings__Host=PC1_IP
      - RabbitMqSettings__Port=5672
      - RabbitMqSettings__Username=guest
      - RabbitMqSettings__Password=guest
      - Cloudinary__CloudName=dlvrwud2y
      - Cloudinary__ApiKey=536731941853732
      - Cloudinary__ApiSecret=Ls8EhXPl8xqhcybYS930AZrpFg0
    restart: unless-stopped
    networks:
      - chatapp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  chatapp-network:
    driver: bridge
